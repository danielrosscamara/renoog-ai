<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Renoog AI — talk with story companions by lamplight." />
    <!-- Browser chrome colour before the CSS loads: --bg of the dark and light themes in tokens.css. -->
    <meta name="theme-color" content="#1A1520" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
         href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Nunito:wght@700;800&display=swap" />
  <script>
    // Before first paint, so there is no flash of the wrong theme or text size.
    // Mirrors features/settings/useSettingsStore.ts; keep keys and values in sync.
    try {
      var root = document.documentElement
      var t = localStorage.getItem('renoog.theme')
      if (t === 'system') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      }
      if (t === 'light' || t === 'dark') root.dataset.theme = t
      var size = { small: '15px', medium: '16px', large: '18px' }[localStorage.getItem('renoog.chatTextSize')]
      if (size) root.style.setProperty('--chat-font-size', size)
    } catch (_) {}
  </script>
    <title>Renoog AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
